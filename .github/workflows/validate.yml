name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  profiles:
    name: Profiles are valid, clean and safe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regenerate profiles from the spec
        shell: pwsh
        run: ./tools/build-profiles.ps1

      - name: Fail if the committed profiles drifted from the spec
        shell: pwsh
        run: |
          # NOTE: compare CONTENT, not bytes.
          #
          # build-profiles.ps1 serialises with ConvertTo-Json, and the two
          # PowerShell hosts indent differently:
          #
          #   Windows PowerShell 5.1   "Key":  {   + deep tab-aligned indent
          #   PowerShell 7 (pwsh)      "Key": {},  + 4-space indent
          #
          # Profiles generated on a maintainer's 5.1 box are therefore always
          # byte-different from the same profiles regenerated by `pwsh` here,
          # even when nothing has actually changed. A raw `git status` check
          # fails on every push for that reason alone. Round-tripping both
          # sides through this host's serialiser normalises the formatting so
          # only real content drift is reported.
          $ErrorActionPreference = 'Stop'
          $files = @(git ls-files profiles | Where-Object { $_ -like '*.lbdev' })
          if (-not $files.Count) { Write-Host "No .lbdev files tracked under profiles/."; exit 1 }
          $drift = @()
          foreach ($f in $files) {
            $committed = (git show "HEAD:$f") -join "`n"
            $generated = Get-Content -LiteralPath $f -Raw
            $a = $committed | ConvertFrom-Json | ConvertTo-Json -Depth 20
            $b = $generated | ConvertFrom-Json | ConvertTo-Json -Depth 20
            if ($a -ne $b) { $drift += $f }
          }
          if ($drift.Count) {
            Write-Host "profiles/ is out of date with tools/profile-spec.json:"
            $drift | ForEach-Object { Write-Host "  $_" }
            Write-Host ""
            Write-Host "Run ./tools/build-profiles.ps1 and commit the result."
            exit 1
          }
          Write-Host "profiles/ matches the spec ($($files.Count) file(s) compared)."

      - name: Validate hygiene and safety rules
        shell: pwsh
        run: ./tools/validate-lbdev.ps1

  hygiene:
    name: No vendor material committed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refuse vendor .lbdev, firmware and extracted app content
        run: |
          set -e
          bad=$(git ls-files \
            | grep -Ei 'vendor-lbdev/|makeit-extract/|\.asar$|\.jsc$|\.enc$|\.tar\.gz$|WeCreat-(Vision|Vista)[^/]*\.lbdev$|WeCreat-Lumos-v[0-9][^/]*\.lbdev$|WECREAT-LC\.lbdev$|(^|/)prefs\.ini$' \
            || true)
          # reference/ may only ever contain its README
          bad="$bad $(git ls-files reference/ | grep -v '^reference/README\.md$' || true)"
          bad=$(echo "$bad" | tr ' ' '\n' | grep -v '^$' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be committed:"
            echo "$bad"
            exit 1
          fi
          echo "No vendor material committed."

  links:
    name: Internal doc links resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check relative markdown links
        run: |
          fail=0
          while IFS= read -r f; do
            dir=$(dirname "$f")
            # pull out ](target) where target is not a URL or anchor
            grep -oE '\]\([^)#][^)]*\)' "$f" 2>/dev/null \
              | sed -E 's/^\]\(//; s/\)$//' \
              | grep -vE '^(https?:|mailto:)' \
              | sed -E 's/#.*$//' \
              | while IFS= read -r t; do
                  [ -z "$t" ] && continue
                  if [ ! -e "$dir/$t" ]; then
                    echo "BROKEN  $f  ->  $t"
                    fail=1
                  fi
                done
          done < <(git ls-files '*.md')
          exit 0   # advisory for now; flip to `exit $fail` once the tree is stable
